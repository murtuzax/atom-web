<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Atomic Model</title>
</head>

<body>
    <div class="atom">
        <div class="nucleus">
            <div class="proton"></div>
            <!-- <div class="neutron"></div> -->
        </div>
        <div class="shell" style="--shell-size:140px; --speed:6s">
            <div class="electron" style="--angle:0deg; --radius:70px;"></div>
            <div class="electron" style="--angle:180deg; --radius:70px;"></div>
        </div>
        <div class="shell" style="--shell-size:260px; --speed:14s">
            <div class="electron" style="--angle:45deg; --radius:130px;"></div>
            <div class="electron" style="--angle:90deg; --radius:130px;"></div>
            <div class="electron" style="--angle:135deg; --radius:130px;"></div>
            <div class="electron" style="--angle:180deg; --radius:130px;"></div>
            <div class="electron" style="--angle:225deg; --radius:130px;"></div>
            <div class="electron" style="--angle:270deg; --radius:130px;"></div>
            <div class="electron" style="--angle:315deg; --radius:130px;"></div>
            <div class="electron" style="--angle:360deg; --radius:130px;"></div>
        </div>
        <div class="shell" style="--shell-size: 360px; --speed: 22s;">
            <div class="electron" style="--angle: 22.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 45deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 67.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 90deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 112.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 135deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 157.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 180deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 202.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 225deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 247.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 270deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 292.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 315deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 337.5deg; --radius: 180px;"></div>
            <div class="electron" style="--angle: 360deg; --radius: 180px;"></div>
        </div>
    </div>

    <div class="mz-container">
        Made by<a href="https://x.com/murtuzax" target="_blank">&nbsp;Murtuza</a>
    </div>
    </body>

</html>
